<svg width="680" height="950" viewBox="0 0 680 950" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CineMatch agent architecture</title>
<desc>Combined diagram: request pipeline overview and ReActAgent tool-calling loop detail.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;font-weight:400;}
.hd{font-size:18px;font-weight:600;fill:#2C2C2A;}
.sub{font-size:13px;font-weight:400;fill:#5F5E5A;}
.c-blue rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:1;} .c-blue .th{fill:#0C447C;} .c-blue .ts{fill:#185FA5;}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1;} .c-teal .th{fill:#085041;} .c-teal .ts{fill:#0F6E56;}
.c-green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:1;} .c-green .th{fill:#27500A;} .c-green .ts{fill:#3B6D11;}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1;} .c-gray .th{fill:#444441;} .c-gray .ts{fill:#5F5E5A;}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="950" fill="#FFFFFF"/>
<text class="hd" x="340" y="24" text-anchor="middle">CineMatch — agent architecture</text>

<!-- ===== Diagram 1: pipeline overview ===== -->
<g class="c-blue"><rect x="190" y="40" width="280" height="56" rx="8"/>
<text class="th" x="330" y="62" text-anchor="middle">Client</text>
<text class="ts" x="330" y="80" text-anchor="middle">GET / and POST /api/execute</text></g>

<g class="c-gray"><rect x="500" y="40" width="130" height="56" rx="8"/>
<text class="th" x="565" y="62" text-anchor="middle">Supabase</text>
<text class="ts" x="565" y="80" text-anchor="middle">Best-effort logging</text></g>
<line x1="470" y1="68" x2="498" y2="68" class="arr" marker-end="url(#arrow)"/>

<line x1="330" y1="96" x2="330" y2="130" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="130" width="280" height="56" rx="8"/>
<text class="th" x="330" y="152" text-anchor="middle">TasteExtractor</text>
<text class="ts" x="330" y="170" text-anchor="middle">Stage 0 — taste extraction</text></g>

<g class="c-gray"><rect x="500" y="130" width="130" height="56" rx="8"/>
<text class="th" x="565" y="152" text-anchor="middle">LLMOD</text>
<text class="ts" x="565" y="170" text-anchor="middle">LLM client</text></g>
<line x1="470" y1="158" x2="498" y2="158" class="arr" marker-end="url(#arrow)"/>

<line x1="330" y1="186" x2="330" y2="220" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="220" width="280" height="56" rx="8"/>
<text class="th" x="330" y="242" text-anchor="middle">ReActAgent</text>
<text class="ts" x="330" y="260" text-anchor="middle">Stage 1 — bounded tool-calling loop</text></g>

<line x1="330" y1="276" x2="330" y2="310" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="310" width="280" height="56" rx="8"/>
<text class="th" x="330" y="332" text-anchor="middle">Verify recommendation</text>
<text class="ts" x="330" y="350" text-anchor="middle">Deterministic availability check</text></g>

<g class="c-gray"><rect x="500" y="310" width="130" height="56" rx="8"/>
<text class="th" x="565" y="332" text-anchor="middle">TMDB</text>
<text class="ts" x="565" y="350" text-anchor="middle">Movies &amp; providers</text></g>
<line x1="470" y1="338" x2="498" y2="338" class="arr" marker-end="url(#arrow)"/>

<line x1="330" y1="366" x2="330" y2="400" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="190" y="400" width="280" height="56" rx="8"/>
<text class="th" x="330" y="422" text-anchor="middle">ReflectionAgent</text>
<text class="ts" x="330" y="440" text-anchor="middle">Stage 2 — taste / novelty judgment</text></g>

<line x1="330" y1="456" x2="330" y2="490" class="arr" marker-end="url(#arrow)"/>

<g class="c-green"><rect x="190" y="490" width="280" height="56" rx="8"/>
<text class="th" x="330" y="512" text-anchor="middle">Final response</text>
<text class="ts" x="330" y="530" text-anchor="middle">Returned to client</text></g>

<!-- ===== Section divider ===== -->
<text class="sub" x="340" y="600" text-anchor="middle">ReActAgent — stage 1 detail</text>
<line x1="80" y1="612" x2="600" y2="612" stroke="#D3D1C7" stroke-width="1"/>

<!-- ===== Diagram 2: ReActAgent detail (offset +630) ===== -->
<g class="c-teal"><rect x="190" y="660" width="300" height="56" rx="8"/>
<text class="th" x="340" y="682" text-anchor="middle">ReActAgent</text>
<text class="ts" x="340" y="700" text-anchor="middle">Stage 1 — bounded tool-calling loop</text></g>

<path d="M340 716 L340 738 L130 738 L130 760" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="716" x2="340" y2="760" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 716 L340 738 L550 738 L550 760" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-green"><rect x="40" y="760" width="180" height="56" rx="8"/>
<text class="th" x="130" y="782" text-anchor="middle">rag_search</text>
<text class="ts" x="130" y="800" text-anchor="middle">Semantic search</text></g>

<g class="c-green"><rect x="250" y="760" width="180" height="56" rx="8"/>
<text class="th" x="340" y="782" text-anchor="middle">tmdb_fallback</text>
<text class="ts" x="340" y="800" text-anchor="middle">Broader movie search</text></g>

<g class="c-green"><rect x="460" y="760" width="180" height="56" rx="8"/>
<text class="th" x="550" y="782" text-anchor="middle">ask_clarification</text>
<text class="ts" x="550" y="800" text-anchor="middle">Ask user a question</text></g>

<line x1="130" y1="816" x2="130" y2="850" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="816" x2="340" y2="850" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="816" x2="550" y2="850" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="40" y="850" width="180" height="56" rx="8"/>
<text class="th" x="130" y="872" text-anchor="middle">Pinecone</text>
<text class="ts" x="130" y="890" text-anchor="middle">Vector index</text></g>

<g class="c-gray"><rect x="250" y="850" width="180" height="56" rx="8"/>
<text class="th" x="340" y="872" text-anchor="middle">TMDB</text>
<text class="ts" x="340" y="890" text-anchor="middle">Movies &amp; providers</text></g>

<g class="c-gray"><rect x="460" y="850" width="180" height="56" rx="8"/>
<text class="th" x="550" y="872" text-anchor="middle">LLMOD</text>
<text class="ts" x="550" y="890" text-anchor="middle">LLM client</text></g>

<path d="M40 788 L18 788 L18 688 L188 688" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
<text class="ts" x="24" y="738" fill="#854F0B">reject +</text>
<text class="ts" x="24" y="752" fill="#854F0B">feedback</text>

</svg>
